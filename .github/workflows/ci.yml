# Mirror of .gitlab-ci.yml check jobs for the GitHub-hosted copy (Decisions log D-03).
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  sdk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: sdk/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm size

  server:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: replayd, POSTGRES_USER: replayd, POSTGRES_PASSWORD: replayd }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U replayd" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      REPLAYD_TEST_DATABASE_URL: postgres://replayd:replayd@localhost:5432/replayd?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server }
      - uses: ariga/setup-atlas@v0
      - run: atlas migrate validate --dir file://server/migrations
      - run: atlas migrate apply --dir file://server/migrations --url "$REPLAYD_TEST_DATABASE_URL"
      - run: cargo fmt --check
        working-directory: server
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: server
      - run: cargo test --locked
        working-directory: server

  dashboard:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: dashboard/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  operations:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/test-backup.mjs
      - run: docker run --rm -v "$PWD/wordpress/replayd-wp:/plugin:ro" php:8.3-cli php /plugin/tests/run.php
      - run: python3 scripts/package-wordpress.py
      - uses: actions/upload-artifact@v4
        with:
          name: wordpress-plugin
          path: data/releases/replayd-wp-*.zip

  benchmarks:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: sdk } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: sdk/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @replayd/bench exec playwright install --with-deps chromium
      - run: pnpm bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: sdk/bench/results
          retention-days: 30
