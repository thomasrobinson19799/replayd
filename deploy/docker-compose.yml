# replayd stack. `make dev` starts only postgres + migrations; `make up` starts everything (profile "app").
name: replayd

x-pg-url: &pg_url "postgres://replayd:${REPLAYD_PG_PASSWORD:-replayd}@postgres:5432/replayd?sslmode=disable"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: replayd
      POSTGRES_USER: replayd
      POSTGRES_PASSWORD: ${REPLAYD_PG_PASSWORD:-replayd}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100", "-c", "wal_compression=on"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-replayd.sql:ro
    ports:
      - "127.0.0.1:${REPLAYD_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replayd -d replayd"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backup:
    profiles: ["backup"]
    image: postgres:17
    entrypoint: ["/bin/sh"]
    command: ["/opt/replayd-backup/loop.sh"]
    environment:
      PGHOST: postgres
      PGUSER: replayd
      PGDATABASE: replayd
      PGPASSWORD: ${REPLAYD_PG_PASSWORD:-replayd}
      BACKUP_RETENTION_DAYS: ${REPLAYD_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backup:/opt/replayd-backup:ro
      - pgbackups:/backups
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -type f -name 'replayd-*.dump' -mmin -1560 -print -quit | grep -q ."]
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 5m
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  migrate:
    image: arigaio/atlas:1.3.6
    command: ["migrate", "apply", "--dir", "file:///migrations", "--url", *pg_url]
    volumes:
      - ../server/migrations:/migrations:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  replayd:
    profiles: ["app"]
    build:
      context: ../server
    image: ${REPLAYD_IMAGE:-replayd:local}
    environment:
      REPLAYD_DATABASE_URL: *pg_url
      REPLAYD_DATA_DIR: /data
      REPLAYD_LISTEN: 0.0.0.0:8080
      REPLAYD_PUBLIC_URL: ${REPLAYD_PUBLIC_URL:-http://localhost:8088}
      REPLAYD_BOOTSTRAP_ADMIN_EMAIL: ${REPLAYD_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      REPLAYD_BOOTSTRAP_ADMIN_PASSWORD: ${REPLAYD_BOOTSTRAP_ADMIN_PASSWORD:-change-me-now}
      REPLAYD_LOG: info
      # Telegram Bot API base (e2e points it at a mock on the host)
      REPLAYD_TELEGRAM_API: ${REPLAYD_TELEGRAM_API:-https://api.telegram.org}
      # Per-IP rate limits key on the real client: trust our nginx (fixed address below) and the sites'
      # /_rp/ tunnel nginx hosts (comma-separated IPs in REPLAYD_SITE_PROXIES).
      REPLAYD_TRUSTED_PROXIES: ${REPLAYD_NGINX_IP:-172.30.53.10},${REPLAYD_SITE_PROXIES:-}
      # Bucket for finished recordings (docs/object-storage.md); empty keeps everything on this volume.
      REPLAYD_S3_ENDPOINT: ${REPLAYD_S3_ENDPOINT:-}
      REPLAYD_S3_BUCKET: ${REPLAYD_S3_BUCKET:-}
      REPLAYD_S3_REGION: ${REPLAYD_S3_REGION:-}
      REPLAYD_S3_ACCESS_KEY: ${REPLAYD_S3_ACCESS_KEY:-}
      REPLAYD_S3_SECRET_KEY: ${REPLAYD_S3_SECRET_KEY:-}
      REPLAYD_S3_UPLOAD_IDLE_SECS: ${REPLAYD_S3_UPLOAD_IDLE_SECS:-}
      REPLAYD_S3_CACHE_MB: ${REPLAYD_S3_CACHE_MB:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - replay-data:/data
    expose: ["8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  nginx:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    image: ${REPLAYD_NGINX_IMAGE:-replayd-nginx:local}
    ports:
      - "${REPLAYD_HTTP_PORT:-8088}:80"
    networks:
      default:
        ipv4_address: ${REPLAYD_NGINX_IP:-172.30.53.10}
    depends_on: [replayd]
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: ${REPLAYD_SUBNET:-172.30.53.0/24}

volumes:
  pgdata:
  pgbackups:
  replay-data:
