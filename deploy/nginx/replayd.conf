# replayd behind nginx (PRD §9). TLS terminates here in production: add `listen 443 ssl http2;`,
# ssl_certificate/ssl_certificate_key, and redirect :80 → :443. Optionally restrict the dashboard to office/VPN IPs.
upstream replayd { server replayd:8080; keepalive 64; }

server {
    # Preserve the external host/port/scheme behind Docker and TLS reverse proxies.
    absolute_redirect off;
  listen 80;
  server_name _;
  server_tokens off;

  # Dashboard assets are precompressed at build time (gzip_static); API JSON is compressed on the fly.
  # .rpl recordings (application/octet-stream) are not in gzip_types: their frames are gzip already.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/json application/javascript text/css image/svg+xml;
  gzip_static on;

  # SDK files for script-tag installs, reached through each site's /_rp/ tunnel as /_rp/sdk/….
  # Versioned paths are immutable; latest/ is revalidated so new releases reach sites within minutes.
  location /ingest/sdk/ {
    alias /usr/share/nginx/sdk/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin *;
    access_log off;
  }
  location /ingest/sdk/latest/ {
    alias /usr/share/nginx/sdk/latest/;
    add_header Cache-Control "public, max-age=300";
    add_header Access-Control-Allow-Origin *;
    access_log off;
  }

  # Ingest: SDK traffic (direct for Capacitor, via per-site /_rp/ tunnel for web).
  location /ingest/ {
    proxy_pass http://replayd;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
    client_max_body_size 2m;
    access_log off;
  }

  # Public capabilities remain reachable even with a dashboard office/VPN allowlist.
  location ^~ /api/public/ {
    allow all;
    access_log off;
    error_log /dev/null crit;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    proxy_pass http://replayd;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
  }
  location ^~ /share/ {
    allow all;
    access_log off;
    error_log /dev/null crit;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control no-store always;
    try_files /200.html =404;
  }

  # Dashboard API.
  location /api/ {
    # allow 10.0.0.0/8; deny all;   # optional office/VPN allowlist
    proxy_pass http://replayd;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;   # source map uploads
    proxy_buffering off;        # stream .rpl recordings
  }

  location = /healthz { proxy_pass http://replayd; access_log off; }
  # /metrics is scraped from the internal network directly on replayd:8080, never exposed here.
  location = /metrics { return 404; }

  # Dashboard SPA.
  root /usr/share/nginx/html;
  location /_nuxt/ { allow all; expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri $uri/index.html /200.html; }
}
