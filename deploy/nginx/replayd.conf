# replayd behind nginx (PRD §9). TLS terminates here in production: add `listen 443 ssl http2;`,
# ssl_certificate/ssl_certificate_key, and redirect :80 → :443. Optionally restrict the dashboard to office/VPN IPs.
upstream replayd { server replayd:8080; keepalive 64; }

server {
  listen 80;
  server_name _;
  server_tokens off;

  # Ingest: SDK traffic (direct for Capacitor, via per-site /_rp/ tunnel for web).
  location /ingest/ {
    proxy_pass http://replayd;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
    client_max_body_size 2m;
    access_log off;
  }

  # Dashboard API.
  location /api/ {
    # allow 10.0.0.0/8; deny all;   # optional office/VPN allowlist
    proxy_pass http://replayd;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;   # source map uploads
    proxy_buffering off;        # stream .rpl recordings
  }

  location = /healthz { proxy_pass http://replayd; access_log off; }
  # /metrics is scraped from the internal network directly on replayd:8080, never exposed here.
  location = /metrics { return 404; }

  # Dashboard SPA.
  root /usr/share/nginx/html;
  location /_nuxt/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri $uri/ /200.html; }
}
