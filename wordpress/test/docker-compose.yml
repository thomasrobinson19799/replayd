# Local WordPress for the replayd-wp e2e (e2e/wordpress.e2e.mjs). Not for production.
name: replayd-wp-test
services:
  db:
    image: mysql:8.4
    environment: { MYSQL_DATABASE: wp, MYSQL_USER: wp, MYSQL_PASSWORD: wp, MYSQL_ROOT_PASSWORD: root }
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uwp", "-pwp"], interval: 2s, retries: 60 }
  wp:
    image: wordpress:6.8-php8.3-apache
    depends_on: { db: { condition: service_healthy } }
    environment: { WORDPRESS_DB_HOST: db, WORDPRESS_DB_USER: wp, WORDPRESS_DB_PASSWORD: wp, WORDPRESS_DB_NAME: wp }
    ports: ["127.0.0.1:${WP_PORT:-8089}:80"]
    volumes:
      - wp:/var/www/html
      - ../replayd-wp:/var/www/html/wp-content/plugins/replayd-wp:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
  cli:
    image: wordpress:cli-php8.3
    profiles: [cli]
    user: "33:33"
    depends_on: [wp]
    environment: { WORDPRESS_DB_HOST: db, WORDPRESS_DB_USER: wp, WORDPRESS_DB_PASSWORD: wp, WORDPRESS_DB_NAME: wp }
    volumes:
      - wp:/var/www/html
      - ../replayd-wp:/var/www/html/wp-content/plugins/replayd-wp:ro
volumes:
  wp:
